url: https://github.com/xymy666/dsh-tray-flash
name: xymy666/dsh-tray-flash
category: notify
description:
  en: Blinks the Windows notification-area icon between the app's own icon and a fully transparent frame, and flashes the taskbar button, while a session still shows an unread or waiting dot.
  zh: 任务完成、或有会话在等你审批/回答时，让通知区域的图标在「原图标 ⇄ 全透明」之间闪烁，同时闪任务栏按钮；侧边栏还挂着黄点/绿点就一直闪，点全部消失才停。
icon: https://raw.githubusercontent.com/xymy666/dsh-tray-flash/main/assets/icon-256.png
